# UNTESTED / UNSUPPORTED post-Postgres-migration: this compose file has no
# Postgres service (the old bundled/embedded DB is gone) and hasn't been
# re-verified since the migration. The app dies at startup unless you supply
# an external DATABASE_URL (Neon or otherwise) via .env before `docker compose
# up`. See README's "Docker Compose (VM fallback)" section and
# docs/superpowers/specs/2026-07-30-zoho-supabase-deployment-design.md.
services:
  app:
    build: .
    # Host side honours this repo's allocated dev block (see ~/.claude/docs/port-allocation.md)
    # so `docker compose up` cannot collide with another project's compose. Container side is
    # a fixed 3000 — an internal port collides with nothing, so it needs no allocation.
    ports:
      - "${API_PORT:-43101}:3000"
    env_file: .env
    environment:
      # Pins the in-container port. Without this, .env's PORT_BASE=43100 makes config.js
      # derive 43101 *inside* the container while this mapping targets 3000, so nothing
      # answers. PORT is the documented override for exactly this case.
      - PORT=3000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
